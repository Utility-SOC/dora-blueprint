apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canary-data
spec:
  accessModes:
    - ReadWriteOnce
  # openebs-hostpath, not local-path: this PVC needs to be Velero-FSB-restorable —
  # see apps/openebs-localpv.yaml for why local-path-provisioner can't do that.
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
