# Phase 16/24 (security operations + vulnerability management, built together since Trivy
# Operator is the one real deployment that serves both at once): real vulnerability scanning
# and tracking, not asserted. Trivy Operator watches every workload in the cluster and produces
# VulnerabilityReport/ConfigAuditReport CRDs per real image, continuously -- not a one-shot CLI
# scan, standing infrastructure that catches a newly-disclosed CVE in an already-running image
# without anyone re-running anything.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    targetRevision: 0.34.0
    helm:
      valuesObject:
        trivy:
          ignoreUnfixed: false
        operator:
          scanJobsConcurrentLimit: 2
          # Caught live during a resilience pass: infraAssessmentScannerEnabled (chart default
          # true) spawns a node-collector Job per node needing hostPID + hostPath mounts into
          # /var/lib/etcd, /var/lib/kubelet, etc. -- genuinely incompatible with Kyverno's PSS
          # `restricted` enforcement, not a fixable securityContext gap the way the scan-job pods
          # below were. It was retrying every few seconds, forever, rejected every time --
          # real, continuous API/control-plane churn (a likely contributor to the kube-proxy
          # nftables churn observed separately). Disabled rather than exempted: it's node/infra
          # compliance scanning, not the container-image vulnerability scanning Phase 24 is
          # actually about, and Phase 23's host-posture.py already covers real host posture
          # without needing hostPID/hostPath at all.
          infraAssessmentScannerEnabled: false
          # clusterComplianceEnabled's ClusterComplianceReport CRs (k8s-cis-1.23,
          # k8s-nsa-1.0, k8s-pss-baseline-0.1, k8s-pss-restricted-0.1) consume the infra-
          # assessment data disabled above -- with that data source gone they had nothing to
          # report (sat at real "Unknown" status, honestly, not fabricated) and then started
          # failing to sync at all once infraAssessmentScannerEnabled flipped. Disabled for
          # the same reason: not what Phase 24's vulnerability-scanning goal needs.
          clusterComplianceEnabled: false
          # The chart's scan-job default securityContext has the same gap trivy-operator's own
          # deployment had below -- confirmed by a real admission denial on
          # scan-vulnerabilityreport-* pods ("runAsNonRoot != true", "seccompProfile.type:
          # Required value"), which was rejecting every real scan job continuously.
          scanJobPodTemplatePodSecurityContext:
            runAsNonRoot: true
          scanJobPodTemplateContainerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
        # The chart's own default securityContext (allowPrivilegeEscalation: false,
        # capabilities.drop: [ALL], readOnlyRootFilesystem: true) is close but leaves out
        # runAsNonRoot and seccompProfile -- both required by Kyverno's PSS `restricted`
        # enforcement (require-pod-security-restricted.yaml), confirmed by a real admission
        # denial ("spec.containers[0].securityContext.runAsNonRoot: Required value",
        # "...seccompProfile.type: Required value") before being added here, same pattern as
        # every other chart in this repo needing a securityContext top-up for restricted.
        podSecurityContext:
          runAsNonRoot: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
