apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-writer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: canary-writer
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        # Phase 4's Kyverno rollout (require-pod-security-restricted) caught this
        # missing on a background scan of the already-running pod — it predated
        # enforcement going live, so it was flagged, not blocked. Without this, the
        # *next* time this pod is recreated (every ns-restore drill implicitly does
        # exactly that) it would be denied outright, breaking Phase 3's drill.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          # Phase 12: real apko/Wolfi build (images/canary-writer/apko.yaml), signed keylessly
          # and SBOM-attested by .github/workflows/build-images.yaml -- this exact digest was
          # verified live (cosign verify + verify-attestation, both succeeded against the real
          # workflow identity) before being pinned here. Kyverno's own verify-image-signatures.yaml
          # re-checks the same signature/attestation at admission, independent of this pin.
          image: ghcr.io/utility-soc/canary-writer@sha256:a59f3ccf24fe39c272ae9708be117afd39320661709fe4f4b32a0735ab2bc9da
          # images/canary-writer/apko.yaml's Wolfi python-3.13 package provides python3.13, not a
          # generic `python3` symlink -- the image's own ENTRYPOINT already is python3.13 (real
          # bug caught live in the build workflow's own smoke test), so this command references it
          # explicitly rather than assuming a symlink this Wolfi package doesn't ship.
          command: ["python3.13", "/scripts/writer.py"]
          env:
            - name: CANARY_DB_PATH
              value: /data/canary.db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: scripts
          configMap:
            name: canary-scripts
        - name: data
          persistentVolumeClaim:
            claimName: canary-data
        - name: tmp
          emptyDir: {}
