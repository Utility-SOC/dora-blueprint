# egress: loki-gateway (its provisioned datasource, confirmed reachable post-enforcement
# via a direct in-pod check -- `wget http://loki-gateway.../ready` returning a real HTTP
# 404, i.e. the TCP connection and HTTP round-trip both succeeded, not a connection
# timeout) and CoreDNS.
#
# Deliberately NOT allowed: an external call Grafana made on its own to
# 34.120.177.193:443 (likely its own update-check/telemetry phone-home) showed up as a
# real DROPPED verdict in Hubble after this policy went live. That's not a gap to fix --
# Grafana's core function (querying Loki, serving dashboards) doesn't need internet
# access, and blocking unsolicited external egress by default is the actual point of
# this namespace's segmentation. Grafana's own /api/health stayed 200 throughout.
#
# Phase 8 (IAM) adds egress to Keycloak on port 9083, via the external LAN address
# (192.168.1.106) -- same reasoning as argocd-server's identical addition: Keycloak's
# dynamic per-request issuer detection means Grafana's own server-to-server OIDC calls
# need to go through the same hostname the browser's redirect uses, not the in-cluster
# Service name, or the issuer/audience values would mismatch between the two halves of
# the flow.
#
# Phase 9 (Detection) adds the first real ingress rule this policy has ever had. Until
# now Grafana's ingress went entirely unrestricted -- no `ingress`/`ingressDeny` key at
# all means Cilium never turns on ingress enforcement for an endpoint, which is why the
# kubelet's own probe traffic already worked with nothing declared. That was a known,
# flagged gap (see the removed comment above), deferred to the bastion/jumphost work --
# but this phase adds a second real, permanent ingress source (the ns-restore drill
# workflow, reading alert state for t_detect), so this is the moment to close the gap
# instead of deferring it further. Port 3000 is Grafana's real container port (confirmed
# via `kubectl get endpoints grafana` -- the Service's own port 80 is a kube-proxy DNAT
# target, not what Cilium's policy actually sees, same convention already used for
# loki-gateway's 8080 elsewhere in this file). The `host` entity here is the same pattern
# as Keycloak's own ingress rule (infrastructure/cilium/keycloak/keycloak.yaml) --
# same-node kubelet liveness/readiness/startup probes, a different Cilium identity than
# the argo-workflows traffic below despite hitting the same port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: observability
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argo-workflows
          matchExpressions:
            - key: workflows.argoproj.io/workflow
              operator: Exists
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
            app.kubernetes.io/component: gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "9083"
              protocol: TCP
