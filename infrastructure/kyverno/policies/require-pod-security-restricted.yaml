# build-spec §7: "validate.podSecurity against PSS restricted. Per-rule failureAction."
# §2 correction: hand-rolled privileged:false pattern matching misses initContainers
# and ephemeralContainers and is trivially bypassed — this uses Kyverno's native
# podSecurity validation, which directly reuses the Kubernetes PSS implementation.
#
# Scope note (build-spec P8, stated not hidden): kube-system is excluded from this
# policy by the Kyverno chart's own default (config.webhooks.namespaceSelector +
# config.resourceFilters both exclude it) — the same default the build spec's §2
# warns about ("kube-system is excluded from the Kyverno webhook by default, so the
# policy silently would not have evaluated it at all"). Accepted deliberately here:
# nothing this repo deploys targets kube-system, and Cilium/CoreDNS/kube-proxy are
# core cluster plumbing needing broad host access, same as in most real clusters. If
# a future component needs to run in kube-system, this exclusion means Kyverno would
# not evaluate it — re-read this note before adding one.
#
# failureAction: Enforce from the start, not a permanent audit mode — every currently
# privileged workload already has a scoped PolicyException
# (infrastructure/kyverno/exceptions/), verified against this exact policy before it
# went to Enforce, so there was no unknown blast radius to observe in Audit first.
# The audit-then-enforce path is for policies added to a fleet whose impact isn't
# already known; this repo's small, fully-inventoried workload set didn't need that
# step here, but new policies added in later phases should still default to Audit
# with a dated migration plan, per build-spec §7 — this is a one-off, not a
# precedent to copy blind.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security-restricted
spec:
  background: true
  rules:
    - name: restricted
      match:
        any:
          - resources:
              kinds:
                - Pod
      # velero is excluded here rather than via a scoped PolicyException podSecurity
      # entry (see infrastructure/kyverno/exceptions/velero-node-agent.yaml and
      # docs/exceptions/velero-node-agent.md for the full reasoning). Kyverno has a
      # confirmed, still-open bug (kyverno/kyverno#12888) where a podSecurity
      # PolicyException cannot suppress a pod-level runAsUser=0 violation — verified
      # empirically here across four syntax variants (bare controlName, images: ["*"],
      # restrictedField at the pod path, restrictedField redirected to the container
      # path per the issue's own documented workaround) — none worked, all failed
      # identically, against Kyverno v1.18.2. Velero's kopia FSB "hosting pods" set
      # runAsUser: 0 at the pod level with no config surface to change it, so the
      # PolicyException route for this one control is a dead end until upstream fixes
      # it. This exclude has the exact same scope the PolicyException already
      # committed to (the whole velero namespace, not narrower) — it's a different,
      # working Kyverno mechanism for reaching the same documented, reasoned exception,
      # not a widening of it.
      #
      # alloy (observability namespace) is excluded by name for a different reason: a
      # PolicyException here worked for the Pod itself but Kyverno's autogen mechanism
      # generates a *separate* rule (autogen-restricted) that validates the DaemonSet
      # resource directly against its embedded pod template, and a PolicyException has
      # to independently re-match that autogen-generated rule/kind too — adding
      # kind: DaemonSet + ruleNames: [autogen-restricted] to the exception still failed
      # identically (a known-flaky area upstream, see kyverno/policies#264 and
      # kyverno/kyverno#11692). exclude/match on the rule itself doesn't have this
      # problem: Kyverno copies match/exclude verbatim into every autogenerated rule, so
      # one exclude entry here covers both the Pod and the DaemonSet admission checks.
      # See docs/exceptions/alloy-audit-log.md.
      exclude:
        any:
          - resources:
              namespaces:
                - velero
          - resources:
              namespaces:
                - observability
              names:
                - "alloy*"
          - resources:
              namespaces:
                - openldap
              names:
                - "openldap*"
          - resources:
              namespaces:
                - glpi
              names:
                - "glpi-*"
      validate:
        failureAction: Enforce
        podSecurity:
          level: restricted
          version: latest
