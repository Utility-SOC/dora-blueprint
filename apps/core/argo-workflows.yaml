# Drill orchestration (build-spec §6.2): scenarios are Argo WorkflowTemplates in git,
# CronWorkflow or one-off Workflow submissions execute them. server.authModes=server
# (no SSO) matches how Hubble UI is already reachable in this lab — network-level
# access control (SSH tunnel / explicit LAN bind) is the boundary, not an app login.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 1.0.23
    helm:
      valuesObject:
        singleNamespace: false
        server:
          authModes: ["server"]
        # controller.workflowNamespaces defaults to ["default"] — the executor
        # ServiceAccount/Role/RoleBinding get created once per listed namespace, and
        # "default" isn't in the AppProject's allowed destinations. Drills run in
        # argo-workflows itself, not a separate namespace, for now.
        controller:
          workflowNamespaces:
            - argo-workflows
        workflow:
          serviceAccount:
            create: true
          rbac:
            create: true
        # The drill WorkflowTemplate (drills/templates/ns-restore-workflowtemplate.yaml)
        # already sets pod-level and main-container securityContext, but that only
        # covers the user-defined "container:" template field. Argo's emissary executor
        # also injects its own init/wait containers into every workflow pod, which have
        # no securityContext of their own and aren't covered by the template's pod-level
        # settings — allowPrivilegeEscalation/capabilities have no pod-level equivalent
        # in the Kubernetes API at all, so there's no way for a WorkflowTemplate to cover
        # them for containers it doesn't itself define. Confirmed via a real drill run
        # denied at admission: 'spec.initContainers[0].securityContext.
        # allowPrivilegeEscalation: Required value'. executor.securityContext is this
        # chart's supported way to set a default for exactly those injected containers.
        executor:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1001
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
