# Scoped AppProject — build-spec §2/§7: "`project: default` means no guardrails."
# Restricted source repo, explicit destination namespaces (grown as later phases add
# components), and an explicit cluster-resource whitelist rather than "*".
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: "Resilience Lab platform components"
  sourceRepos:
    - git@github.com:utility-soc/elastic-dora-blueprint.git
    - https://grafana.github.io/helm-charts
    - https://charts.min.io/
    - https://vmware-tanzu.github.io/helm-charts
    - https://argoproj.github.io/argo-helm
    - https://openebs.github.io/charts
    - https://kyverno.github.io/kyverno
    - https://charts.jetstack.io
    - https://codecentric.github.io/helm-charts
    - https://helm.cilium.io/
    - https://aquasecurity.github.io/helm-charts
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: local-path-storage
      server: https://kubernetes.default.svc
    - namespace: openebs
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: argo-workflows
      server: https://kubernetes.default.svc
    - namespace: litmus
      server: https://kubernetes.default.svc
    - namespace: velero
      server: https://kubernetes.default.svc
    - namespace: trivy-system
      server: https://kubernetes.default.svc
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: canary
      server: https://kubernetes.default.svc
    - namespace: openldap
      server: https://kubernetes.default.svc
    - namespace: keycloak
      server: https://kubernetes.default.svc
    - namespace: glpi
      server: https://kubernetes.default.svc
    - namespace: tetragon
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: kyverno.io
      kind: ClusterPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
