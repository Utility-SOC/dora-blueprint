# Talos has no bundled CSI driver (unlike k3s's local-path-provisioner-by-default).
# rancher/local-path-provisioner, host path moved off /opt (read-only on Talos) to
# under /var (the persistent, writable partition); local-path-storage namespace
# marked privileged for the provisioner's helper pods.
#
# Correction: docs.siderolabs.com's own example uses /var/mnt/local-path-provisioner,
# which failed here with "mkdir /var/mnt/local-path-provisioner/: read-only file
# system" — /var/mnt is Talos's newer (1.6+) *user volume* mount point, which needs an
# explicit UserVolumeConfig machine-config document before anything can write there.
# Not declared, so /var/mnt itself is still part of the read-only base. A plain path
# directly under /var — persistent and writable without any extra declaration — works
# without that additional machine-config surface.
resources:
  - github.com/rancher/local-path-provisioner/deploy?ref=v0.0.36

patches:
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      - op: replace
        path: /data/config.json
        value: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":["/var/local-path-provisioner"]
                  }
                  ]
          }
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
