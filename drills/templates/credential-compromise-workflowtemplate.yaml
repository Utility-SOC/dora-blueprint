# Executes drills/scenarios/credential-compromise.yaml (build-spec §6.3 scenario 8). Same
# single-bash-step shape as every other drill template. bitnami/kubectl only.
#
# Unlike ns-restore's Grafana Alerting API poll (Phase 9), this reuses the SAME polling pattern
# against the SAME API, just a different rule uid -- no new detection mechanism, matching Phase
# 13's own design decision to reuse Phase 9's Grafana-Alerting-on-Loki pipeline for Tetragon's
# events rather than building a parallel one.
#
# Nothing is actually broken by this drill (canary-writer stays healthy throughout) -- shaped
# like network-partition, not a break/recover scenario: integrity_check is set to "pass"
# unconditionally (no data at stake), and measured_rto_seconds doubles as detection latency
# (t_detect - t_inject) rather than a recovery time.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: credential-compromise
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: run
  templates:
    - name: run
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: platform-ca
          configMap:
            name: platform-ca
      container:
        image: bitnami/kubectl@sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d
        command: ["bash", "-ceu"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: GRAFANA_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: grafana-api-token
                key: token
        volumeMounts:
          - name: platform-ca
            mountPath: /etc/platform-ca
            readOnly: true
        args:
          - |
            DRILL_ID="credential-compromise-$(date -u +%Y%m%d%H%M%S)"
            GIT_SHA="{{workflow.parameters.git-sha}}"

            CANARY_POD="$(kubectl -n canary get pod -l app=canary-writer -o jsonpath='{.items[0].metadata.name}')"

            T_INJECT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "[$DRILL_ID] t_inject=$T_INJECT — harvesting canary-writer's own ServiceAccount token, then spawning a shell (fault injection)"
            kubectl -n canary exec "$CANARY_POD" -- sh -c '
              cat /var/run/secrets/kubernetes.io/serviceaccount/token > /dev/null
              exec /bin/sh -c "id"
            '

            echo "[$DRILL_ID] polling Grafana's Alerting API for real detection of the shell spawn (Tetragon's own eBPF instrumentation)"
            T_DETECT=""
            for i in $(seq 1 20); do
              ALERTS_JSON="$(curl -s --cacert /etc/platform-ca/ca-chain.crt \
                -H "Authorization: Bearer ${GRAFANA_API_TOKEN}" \
                https://grafana.observability.svc.cluster.local:80/api/alertmanager/grafana/api/v2/alerts)"
              CANDIDATE="$(echo "$ALERTS_JSON" | jq -r --arg t "$T_INJECT" '
                [.[] | select(.labels.alertname == "Shell spawned inside canary namespace" and .startsAt >= $t)]
                | sort_by(.startsAt) | .[0].startsAt // empty
              ')"
              if [ -n "$CANDIDATE" ]; then
                T_DETECT="$CANDIDATE"
                echo "[$DRILL_ID] t_detect=$T_DETECT (Grafana alert canary-shell-spawn-detect fired)"
                break
              fi
              sleep 3
            done
            if [ -z "$T_DETECT" ]; then
              echo "[$DRILL_ID] WARNING: no detection alert observed within the poll window -- t_detect will be omitted from the record. A real detection gap, not fabricated." >&2
            fi

            T_RECOVER="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            T_VERIFY="$T_RECOVER"
            if [ -n "$T_DETECT" ]; then
              RTO=$(( $(date -u -d "$T_DETECT" +%s) - $(date -u -d "$T_INJECT" +%s) ))
              VERDICT="pass"
            else
              RTO=$(( $(date -u -d "$T_RECOVER" +%s) - $(date -u -d "$T_INJECT" +%s) ))
              VERDICT="fail"
            fi

            echo "[$DRILL_ID] emitting drill record"
            RECORD="$(cat <<EOF
            {"drill_id":"${DRILL_ID}","scenario":"credential-compromise","git_sha":"${GIT_SHA}","cluster_profile":"core","controls":["DORA-Art9","DORA-Art10","ISO-A.8.16"],"target_rto_seconds":60,"target_rpo_seconds":0,"measured_rto_seconds":${RTO},"integrity_check":"pass","verdict":"${VERDICT}","manual_runbook_steps_required":0,"t_inject":"${T_INJECT}","t_recover":"${T_RECOVER}","t_verify":"${T_VERIFY}","artifacts":["exec target: canary-writer in namespace canary","alert watched: canary-shell-spawn-detect"]}
            EOF
            )"
            if [ -n "$T_DETECT" ]; then
              RECORD="$(echo "$RECORD" | jq -c --arg t "$T_DETECT" '. + {t_detect: $t}')"
            fi
            echo "$RECORD" | jq -c .

            echo "RESULT_RTO_SECONDS=${RTO}"
            echo "RESULT_VERDICT=${VERDICT}"
  arguments:
    parameters:
      - name: git-sha
        value: "unknown"
