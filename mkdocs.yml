      - "Grafana Alloy": components/alloy.md
      - "apko, Wolfi and the SBOM": components/apko-wolfi.md
      - "Argo CD": components/argo-cd.md
      - "Argo Workflows": components/argo-workflows.md
      - "The canary workload (and SQLite)": components/canary.md
      - "cert-manager and the offline CA": components/cert-manager.md
      - "Cilium (and Hubble)": components/cilium.md
      - "Docker": components/docker.md
      - "The drill framework (Python)": components/drill-framework.md
      - "The evidence pipeline": components/evidence-pipeline.md
      - "GitHub Actions": components/github-actions.md
      - "GLPI (and MariaDB)": components/glpi.md
      - "Grafana (dashboards and Alerting)": components/grafana.md
      - "Helm": components/helm.md
      - "Keycloak (and PostgreSQL)": components/keycloak.md
      - "kube-bench (planned)": components/kube-bench.md
      - "Kubernetes": components/kubernetes.md
      - "Kyverno": components/kyverno.md
      - "Loki": components/loki.md
      - "MinIO": components/minio.md
