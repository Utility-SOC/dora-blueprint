# Executes drills/scenarios/ns-restore.yaml. Single bash step, not multiple Argo
# steps/DAG nodes — the logic is sequential and each stage needs the previous
# stage's captured values (backup name, restore namespace, baseline counter), which
# is simpler as script variables than as Argo output-parameter plumbing between
# steps for a first scenario. bitnami/kubectl only — no python in this image; the
# hash-chain check runs where python already lives, inside the canary pods
# themselves, via `kubectl exec`. curl and jq are both present in this image
# (confirmed directly, not assumed) -- Phase 9 (Detection) uses them to poll
# Grafana's Alerting API for a real t_detect, no new image needed.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ns-restore
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: run
  templates:
    - name: run
      # Kyverno's require-pod-security-restricted (Phase 4) applies here too —
      # argo-workflows has no PolicyException, nor should it need one for a plain
      # kubectl-driven script.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: platform-ca
          configMap:
            name: platform-ca
      container:
        image: bitnami/kubectl@sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d
        command: ["bash", "-ceu"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: GRAFANA_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: grafana-api-token
                key: token
        volumeMounts:
          - name: platform-ca
            mountPath: /etc/platform-ca
            readOnly: true
        args:
          - |
            DRILL_ID="ns-restore-$(date -u +%Y%m%d%H%M%S)"
            T_INJECT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            GIT_SHA="{{workflow.parameters.git-sha}}"

            echo "[$DRILL_ID] capturing baseline from the live canary"
            CANARY_POD="$(kubectl -n canary get pod -l app=canary-writer -o jsonpath='{.items[0].metadata.name}')"
            MAX_BEFORE="$(kubectl -n canary exec "$CANARY_POD" -- python3 /scripts/verify.py --field max_counter)"

            echo "[$DRILL_ID] finding most recent completed backup of canary"
            BACKUP_NAME="$(kubectl -n velero get backups.velero.io \
              -o jsonpath='{range .items[?(@.status.phase=="Completed")]}{.metadata.creationTimestamp}{" "}{.metadata.name}{"\n"}{end}' \
              | sort | tail -1 | awk '{print $2}')"
            if [ -z "$BACKUP_NAME" ]; then
              echo "no completed backup found for canary — the hourly Schedule hasn't fired yet" >&2
              exit 1
            fi
            echo "[$DRILL_ID] using backup: $BACKUP_NAME"

            echo "[$DRILL_ID] t_inject=$T_INJECT — deleting namespace canary (fault injection)"
            kubectl delete namespace canary --wait=true --timeout=120s

            # Phase 9 (Detection): t_detect is "first alert fired" (build-spec), a genuine
            # independent signal -- not something this script gets to self-report the way it
            # self-reports t_inject. Polled right after injection (not after the whole drill
            # completes) so a real, already-fired alert instance can't go stale/resolve before
            # we check, and so the timeline mirrors a real incident: fault -> detect -> respond.
            echo "[$DRILL_ID] polling Grafana's Alerting API for real detection of the fault"
            T_DETECT=""
            for i in $(seq 1 40); do
              # Port 80 is Grafana's real Service port (the Service has no listener on 443
              # at all -- confirmed live: an unqualified https:// URL here defaults to 443
              # and fails with connection refused, not a TLS or Cilium problem).
              ALERTS_JSON="$(curl -s --cacert /etc/platform-ca/ca-chain.crt \
                -H "Authorization: Bearer ${GRAFANA_API_TOKEN}" \
                https://grafana.observability.svc.cluster.local:80/api/alertmanager/grafana/api/v2/alerts)"
              CANDIDATE="$(echo "$ALERTS_JSON" | jq -r --arg t "$T_INJECT" '
                [.[] | select(.labels.alertname == "Canary namespace deleted" and .startsAt >= $t)]
                | sort_by(.startsAt) | .[0].startsAt // empty
              ')"
              if [ -n "$CANDIDATE" ]; then
                T_DETECT="$CANDIDATE"
                echo "[$DRILL_ID] t_detect=$T_DETECT (Grafana alert canary-ns-delete-detect fired)"
                break
              fi
              sleep 3
            done
            if [ -z "$T_DETECT" ]; then
              echo "[$DRILL_ID] WARNING: no detection alert observed within the poll window -- t_detect will be omitted from the record. A real detection gap, not fabricated." >&2
            fi

            RESTORE_NS="canary-restored-$(date -u +%Y%m%d%H%M%S)"
            RESTORE_NAME="${DRILL_ID}-restore"

            # Pre-create and label the target namespace before Velero touches it —
            # left to Velero's own namespace-restore-from-backup, it comes back
            # unlabelled, and OpenEBS localpv-provisioner's helper pods (hostPath +
            # privileged init container) get rejected by the baseline PodSecurity
            # default the same way the original canary namespace's PVC did.
            kubectl create namespace "$RESTORE_NS"
            kubectl label namespace "$RESTORE_NS" pod-security.kubernetes.io/enforce=privileged

            cat <<EOF | kubectl apply -f -
            apiVersion: velero.io/v1
            kind: Restore
            metadata:
              name: ${RESTORE_NAME}
              namespace: velero
            spec:
              backupName: ${BACKUP_NAME}
              includedNamespaces:
                - canary
              namespaceMapping:
                canary: ${RESTORE_NS}
            EOF

            echo "[$DRILL_ID] waiting for restore into $RESTORE_NS"
            while true; do
              PHASE="$(kubectl -n velero get restore "$RESTORE_NAME" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              case "$PHASE" in
                Completed) break ;;
                PartiallyFailed|Failed)
                  echo "restore $RESTORE_NAME ended in $PHASE" >&2
                  exit 1
                  ;;
              esac
              sleep 5
            done

            echo "[$DRILL_ID] waiting for the restored canary-writer to report Ready"
            kubectl -n "$RESTORE_NS" wait --for=condition=Ready pod -l app=canary-writer --timeout=180s
            T_RECOVER="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            RESTORED_POD="$(kubectl -n "$RESTORE_NS" get pod -l app=canary-writer -o jsonpath='{.items[0].metadata.name}')"
            INTEGRITY="$(kubectl -n "$RESTORE_NS" exec "$RESTORED_POD" -- python3 /scripts/verify.py --field integrity_check)"
            MAX_AFTER="$(kubectl -n "$RESTORE_NS" exec "$RESTORED_POD" -- python3 /scripts/verify.py --field max_counter)"
            T_VERIFY="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            RTO=$(( $(date -u -d "$T_RECOVER" +%s) - $(date -u -d "$T_INJECT" +%s) ))
            RPO_RECORDS=$(( MAX_BEFORE - MAX_AFTER ))
            if [ "$INTEGRITY" = "pass" ]; then VERDICT="pass"; else VERDICT="fail"; fi

            echo "[$DRILL_ID] emitting drill record"
            RECORD="$(cat <<EOF
            {"drill_id":"${DRILL_ID}","scenario":"ns-restore","git_sha":"${GIT_SHA}","cluster_profile":"core","controls":["DORA-Art11","DORA-Art12","NIS2-21.2.c","ISO-A.8.13","ISO-A.5.29","ISO-A.8.16","DORA-Art10"],"target_rto_seconds":300,"target_rpo_seconds":3600,"measured_rto_seconds":${RTO},"measured_rpo_records_lost":${RPO_RECORDS},"integrity_check":"${INTEGRITY}","verdict":"${VERDICT}","manual_runbook_steps_required":0,"t_inject":"${T_INJECT}","t_recover":"${T_RECOVER}","t_verify":"${T_VERIFY}","artifacts":["velero backup: ${BACKUP_NAME}","velero restore: ${RESTORE_NAME}","restored namespace: ${RESTORE_NS}"]}
            EOF
            )"
            if [ -n "$T_DETECT" ]; then
              RECORD="$(echo "$RECORD" | jq --arg t "$T_DETECT" '. + {t_detect: $t}')"
            fi
            echo "$RECORD"

            echo "RESULT_RTO_SECONDS=${RTO}"
            echo "RESULT_RPO_RECORDS_LOST=${RPO_RECORDS}"
            echo "RESULT_VERDICT=${VERDICT}"
  arguments:
    parameters:
      - name: git-sha
        value: "unknown"
