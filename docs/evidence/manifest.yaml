# Evidence tagging manifest -- the source of truth for which control frameworks each real
# evidence artifact satisfies. `collect.py` reads this file and generates
# docs/evidence/by-control/<tag>/ as real file copies, one per tag an artifact carries -- an
# artifact evidencing four controls across three frameworks shows up in four folders, not
# duplicated by hand four times.
#
# Tag namespaces:
#   dora:<article>        -- DORA article, matches docs/03-control-matrix.md
#   nis2:<article>         -- NIS2 article, matches docs/03-control-matrix.md
#   iso27001:<annex-a-id>  -- ISO 27001 Annex A control, matches docs/03-control-matrix.md
#   nist80053:<control-id> -- NIST SP 800-53 Rev 5 control, see docs/06-nist-800-53-crosswalk.md
#   attack:<technique-id>  -- MITRE ATT&CK technique, see docs/07-attack-mapping.md
#
# Every tag here must trace back to a real row in one of those docs -- this file does not
# introduce new claims, it just re-indexes ones already made and evidenced elsewhere.

artifacts:
  - path: samples/kyverno-admission-20260728202845.txt
    description: Real admission denial of a privileged pod (Kyverno PSS restricted enforcement)
    tags: [dora:art-9, nist80053:cm-7]

  - path: samples/cilium-network-segmentation-20260729015300.txt
    description: Default-deny blocking unwanted egress while explicit allows and cross-namespace DNS keep working, across all 8 segmented namespaces
