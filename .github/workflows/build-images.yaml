# Phase 12 (supply chain): build canary-writer from images/canary-writer/apko.yaml, sign it
# keylessly (GitHub OIDC -> Fulcio -> Rekor, per BUILD-SPEC.md section 8 and a direct choice
# made with the repo owner about the public-transparency-log tradeoff for a private repo),
# generate and attest a CycloneDX SBOM, and push everything to GHCR under a digest -- never a
# floating tag, matching the ":latest banned; digests only" registry-allowlist policy this same
# phase adds to Kyverno (infrastructure/kyverno/policies/verify-image-signatures.yaml).
#
# SBOM generation intentionally does NOT use apko's own bundled SBOM output -- `syft`
# (anchore/sbom-action, a widely used, independently-maintained tool) scans the real pushed
# digest instead, so the SBOM attestation is an independent cross-check of what actually landed
# in the registry, not a build-time artifact apko could get wrong silently.
#
# Weekly rebuild (the `schedule` trigger) runs against current Wolfi packages regardless of
# whether anything in this repo changed -- the whole point (ISO A.8.8, patch management): a
# Wolfi/Chainguard CVE fix lands in the base image without anyone having to notice and open a PR.
name: Build, sign, and attest images

on:
  push:
    branches: [master]
    paths:
      - "images/**"
      - "canary/writer.py"
      - "canary/verify.py"
      - ".github/workflows/build-images.yaml"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless: Fulcio issues a short-lived cert bound to this run's OIDC token

jobs:
  canary-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CAUGHT LIVE: OCI repository names must be all-lowercase ("repository can only contain
      # the characters abcdefghijklmnopqrstuvwxyz0123456789_-./") -- github.repository_owner for
      # this org is "Utility-SOC", mixed case, which apko rejected outright on the real push.
      # Lowercased once here rather than depending on every later step to remember to do it.
      - name: Compute lowercase image ref
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/canary-writer" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install apko
        # actions/setup-go puts $(go env GOPATH)/bin on PATH for subsequent steps -- without it,
        # `go install`'d binaries land on disk but aren't found by name in the next step.
        #
        # CAUGHT LIVE: `go install github.com/chainguard-dev/apko@latest` fails --
        # apko's own go.mod declares its module path as `chainguard.dev/apko`, not the
        # `github.com/chainguard-dev/apko` import path its GitHub URL would suggest
        # ("module declares its path as: chainguard.dev/apko but was required as:
        # github.com/chainguard-dev/apko"). Confirmed from a real failed run, not guessed.
        run: go install chainguard.dev/apko@latest

      # CAUGHT LIVE: originally resolved the digest with a separate `crane digest` call after
      # publish, on the theory that apko's own stdout format wasn't something to depend on. In
      # practice `crane digest` immediately after a fresh push hit GHCR propagation lag -- it
      # worked in one real run and 404'd ("MANIFEST_UNKNOWN") in the very next one, a real
      # flakiness risk for a workflow meant to run unattended weekly. apko publish's own last
      # stdout line turns out to already be the exact clean "ghcr.io/...@sha256:..." reference
      # (confirmed from real run output) -- using that directly removes the extra network
      # round-trip and the tool entirely.
      - name: Build and publish (apko)
        id: publish
        run: |
          set -euo pipefail
          TAG="sha-$(git rev-parse --short HEAD)"
          OUTPUT="$(apko publish images/canary-writer/apko.yaml "${IMAGE}:${TAG}")"
          echo "$OUTPUT"
          DIGEST="$(echo "$OUTPUT" | tail -1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (real container run, not assumed from a clean build)
        # CAUGHT LIVE: images/canary-writer/apko.yaml sets entrypoint.command to
        # /usr/bin/python3.13 directly -- `docker run <image> python3.13 -c ...` appends
        # "python3.13" as python's own argv[1], which python then tries to open as a *script
        # file* ("can't open file '//python3.13'"). The entrypoint already *is* python3.13, so
        # only -c and its argument belong here.
        run: |
          set -euo pipefail
          docker run --rm "${{ steps.publish.outputs.digest }}" \
            -c "import hashlib, os, sqlite3, time, json, sys; print('stdlib deps ok')"

      # Two real, consequential questions this image's minimal package list
      # (images/canary-writer/apko.yaml: wolfi-baselayout, ca-certificates-bundle, python-3.13
      # only -- no busybox/bash) raises for existing consumers, checked here rather than assumed:
      # (1) drills/templates/{node-kill,ns-restore,pvc-corruption-restore}-workflowtemplate.yaml
      # already updated to `kubectl exec ... -- python3.13` (not the bare `python3` this minimal
      # image may not symlink); (2) the credential-compromise scenario's entire fault injection
      # is `kubectl exec ... -- /bin/sh -c "id; ..."` -- if this image has no shell at all, that
      # drill breaks outright. Checked against the real published+signed digest, in the one place
      # with correctly-scoped GHCR pull credentials (this job's own GITHUB_TOKEN) -- a personal
      # PAT lacks the read:packages scope GHCR pulls need, confirmed live via a real `denied`
      # trying to pull this same digest from appserv.
      - name: Check for /bin/sh and a bare python3 (real consumers depend on both)
        run: |
          set -euo pipefail
          echo "-- /bin/sh --"
          docker run --rm --entrypoint /bin/sh "${{ steps.publish.outputs.digest }}" -c 'echo /bin/sh: present' \
            || echo "/bin/sh: ABSENT -- drills/scenarios/credential-compromise.yaml's fault injection would break"
          echo "-- bare python3 --"
          docker run --rm --entrypoint /usr/bin/python3 "${{ steps.publish.outputs.digest }}" --version \
            || echo "python3 (unversioned): ABSENT -- confirms python3.13 is required explicitly everywhere, as already fixed"

      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.publish.outputs.digest }}"

      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.publish.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.publish.outputs.digest }}"

      - name: Verify signature and attestation (real verification, not assumed from a 0 exit code above)
        # Exact --certificate-identity, not a regexp -- matches BUILD-SPEC.md section 8's own
        # requirement ("the specific repository *and workflow identity*"), and is the same
        # identity infrastructure/kyverno/policies/verify-image-signatures.yaml requires at
        # admission. schedule/workflow_dispatch runs (the weekly rebuild) still execute against
        # the default branch, so the ref is always refs/heads/master here, never a PR ref.
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/build-images.yaml@refs/heads/master"
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.publish.outputs.digest }}"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.publish.outputs.digest }}"

      - name: Summary
        run: |
          echo "### canary-writer built, signed, and attested" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.publish.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
