# Phase 16/24 (security operations + vulnerability management, built together since Trivy
# Operator is the one real deployment that serves both at once): real vulnerability scanning
# and tracking, not asserted. Trivy Operator watches every workload in the cluster and produces
# VulnerabilityReport/ConfigAuditReport CRDs per real image, continuously -- not a one-shot CLI
# scan, standing infrastructure that catches a newly-disclosed CVE in an already-running image
# without anyone re-running anything.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    targetRevision: 0.34.0
    helm:
      valuesObject:
        trivy:
          ignoreUnfixed: false
        operator:
          scanJobsConcurrentLimit: 2
        # The chart's own default securityContext (allowPrivilegeEscalation: false,
        # capabilities.drop: [ALL], readOnlyRootFilesystem: true) is close but leaves out
        # runAsNonRoot and seccompProfile -- both required by Kyverno's PSS `restricted`
        # enforcement (require-pod-security-restricted.yaml), confirmed by a real admission
        # denial ("spec.containers[0].securityContext.runAsNonRoot: Required value",
        # "...seccompProfile.type: Required value") before being added here, same pattern as
        # every other chart in this repo needing a securityContext top-up for restricted.
        podSecurityContext:
          runAsNonRoot: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
