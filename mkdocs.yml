site_name: dora-blueprint
site_description: A GitOps Kubernetes reference architecture that measures its own recovery objectives and maps them to DORA, NIS2, ISO 27001 and NIST SP 800-53.
site_url: https://utility-soc.github.io/dora-blueprint/
repo_url: https://github.com/Utility-SOC/dora-blueprint
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

# Evidence samples and generated per-control copies are data, not pages.
exclude_docs: |
  evidence/by-control/
  evidence/__pycache__/
  evidence/*.py
  evidence/*.yaml
  evidence/*.json

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

# Page lists are maintained here; tests/test_docs_site.py fails if a page exists but is not listed.
nav:
  - Home: index.md
  - Start here:
      - Executive summary: guide/executive-summary.md
      - How it works: guide/how-it-works.md
      - Reading the evidence: guide/reading-the-evidence.md
      - Glossary: guide/glossary.md
  - Tools and products:
