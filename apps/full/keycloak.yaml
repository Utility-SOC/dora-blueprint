# Phase 8 (IAM): the IdP. codecentric/keycloakx, not bitnami/keycloak -- checked directly
# that bitnami/openldap no longer exists in Bitnami's catalog at all (their free-tier
# catalog has been shrinking), which is exactly the kind of instability worth avoiding
# for the IdP itself. keycloakx is an actively maintained, Quarkus-based (modern
# Keycloak.X) community chart.
#
# database.vendor: postgres (infrastructure/keycloak/postgres.yaml, synced by the
# separate apps/keycloak-postgres.yaml Application) -- was dev-mem (in-memory H2)
# through Phase 8, revisited once IAM was proven working end-to-end and a pod restart
# demonstrated the real cost: every realm/user/credential lived only in the JVM heap,
# gone on any restart. Realm/client/LDAP-federation config is still scripted via
# kcadm.sh against the live admin API (see infrastructure/keycloak/configure-realm.sh),
# not a hand-written realm-export JSON -- that choice was never about the database, and
# doesn't change here.
#
# Admin bootstrap credentials via KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD (the current
# Keycloak 26.x convention -- KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD were deprecated).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.2.2
    helm:
      valuesObject:
        replicas: 1
        # Neither this chart nor the base Keycloak image supplies a default `command`/
        # `args` that actually starts the server -- confirmed via a real crash loop
        # where the container just printed kc.sh's own usage/help text and exited.
        # `start-dev` matches the dev-mem database choice above (auto-enables http,
        # relaxes hostname/cert requirements) -- the lab-appropriate dev-mode start
        # command, not `start` (which expects a production-grade config this repo isn't
        # providing here).
        args:
          - "start-dev"
        # The chart's own default securityContext (runAsUser: 1000, runAsNonRoot: true)
        # is compliant but incomplete -- missing allowPrivilegeEscalation/capabilities/
        # seccompProfile, caught by a real admission denial (the StatefulSet couldn't
        # create a single pod, "FailedCreate" x15 over 94s, until this was added).
        # Unlike OpenLDAP, this image genuinely runs fine fully restricted -- no
        # Kyverno exception needed here.
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        database:
          vendor: postgres
          hostname: keycloak-postgres
          port: 5432
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db
          existingSecretKey: password
        extraEnv: |
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-admin
                key: password
          - name: KC_HEALTH_ENABLED
            value: "true"
        # No startupProbe override -- an earlier attempt hand-wrote one as a native YAML
        # map and hit a real Argo CD sync error ("wrong type for value; expected string;
        # got map[string]interface {}"): this chart takes several probe/volume-style
        # values as raw YAML *strings* (same convention as extraEnv/extraVolumes above),
        # not native maps. Rather than guess the right templated path/port syntax the
        # chart's own default uses, just keep that default -- it's already a reasonable
        # 300s startup budget (failureThreshold: 60 x periodSeconds: 5).
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
