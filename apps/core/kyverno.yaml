# Admission control (build-spec §7): validate.podSecurity against PSS "restricted",
# not hand-rolled privileged:false pattern matching — build-spec §2 flags that as
# missing initContainers/ephemeralContainers and trivially bypassed.
# policyExceptions.namespace restricts exception *creation* to the kyverno namespace
# (infrastructure/kyverno/exceptions/ lands there) — a security boundary, not just an
# organisational one: nobody in canary/velero/etc. can grant themselves an exception
# by dropping a PolicyException in their own namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      valuesObject:
        # Nested under features:, not top-level — a bare top-level policyExceptions:
        # key is silently ignored by Helm (unknown key, no template references it),
        # which is exactly what happened here: the value looked applied (no error,
        # no sync failure) but --enablePolicyException=false stayed the deployed
        # reality until this was checked directly on the running container's args.
        features:
          policyExceptions:
            enabled: true
            namespace: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Same class of issue build-spec §2 flags for cert-manager's CRDs:
      # clusterpolicies.kyverno.io and policies.kyverno.io exceed client-side
      # apply's 262144-byte last-applied-configuration annotation limit.
      - ServerSideApply=true
