# Same reasoning as background-controller.yaml: Hubble confirmed reports-controller
# (generates PolicyReport/ClusterPolicyReport resources) only calls out to
# kube-apiserver, no ingress needed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: reports-controller
  namespace: kyverno
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: reports-controller
  ingressDeny:
    - {}
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
