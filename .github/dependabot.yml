# Keeps the commit-SHA pins in .github/workflows/ current through reviewed PRs, so pinning is a
# maintained control rather than a frozen one (roadmap T07, gap G18). Dependabot updates both the
# SHA and the trailing "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
