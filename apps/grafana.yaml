# Dashboards + alerting on top of the existing Loki+Alloy pipeline (Phase 2/4). Deployed for a
# hands-on comparison against Elastic/Kibana before locking in the security-plane's detection-
# layer technology — see the "Technology decision" section of the security-plane roadmap plan.
# Loki datasource is provisioned declaratively (datasources.yaml below), not clicked in through
# the UI, matching this repo's GitOps-everything discipline. No ingress: reached via the same
# LAN port-forward pattern already used for Argo CD and Hubble UI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        persistence:
          enabled: true
          size: 2Gi
        # The chart's own defaults (pod securityContext runAsNonRoot/fsGroup 472,
        # containerSecurityContext dropping all capabilities) are already fully
        # restricted-compliant. The one gap is initChownData, a helper init container that
        # chowns the PVC path and needs root+CAP_CHOWN to do it — genuinely incompatible
        # with restricted, confirmed via a real admission denial. Disabling it rather than
        # adding a Kyverno exception: fsGroup 472 already makes Kubernetes itself apply the
        # same ownership at mount time (a modern, more mature mechanism than
        # initChownData's manual chown, which the chart keeps around mainly for storage
        # backends predating reliable fsGroup support — not a concern for the
        # local-path-provisioner-backed PVC here).
        initChownData:
          enabled: false
        # Deliberately NOT using the chart's default auto-generated admin Secret: Argo CD
        # re-renders the Helm chart on every sync (unlike a stateful `helm upgrade`), and this
        # chart's admin-password templating has no lookup-based guard to preserve an existing
        # value across renders — confirmed by a real password change between two syncs, which
        # broke a login that had worked minutes earlier. Pointing at an existingSecret created
        # out-of-band (kubectl, never committed to git) sidesteps the regeneration entirely and
        # keeps the credential out of the repo.
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        # The chart's default livenessProbe budget (~6 min: 60s initial delay + 10 retries at
        # 30s timeout) isn't enough for a fresh install's full SQLite migration run on this
        # lab's shared, not-fast storage -- confirmed via a real crash loop: kubelet kept
        # killing the container mid-migration, restarting it, and it re-ran migrations from
        # the top each time, never finishing. A startupProbe with a much larger budget handles
        # the one-time slow first boot; liveness/readiness stay at chart defaults for normal,
        # already-migrated restarts.
        startupProbe:
          httpGet:
            path: /api/health
            port: grafana
            scheme: HTTPS
          periodSeconds: 10
          failureThreshold: 60
        # Chart defaults for these two don't parameterize scheme by protocol -- switching
        # server.protocol to https below (real cert-manager-issued TLS, not self-signed)
        # would otherwise leave both probes hitting a TLS port with a plain HTTP GET,
        # which fails identically to the startupProbe timeout this repo already hit and
        # fixed once before (see the startupProbe comment above) -- anticipated here
        # rather than found by a second crash loop.
        readinessProbe:
          httpGet:
            path: /api/health
            port: grafana
            scheme: HTTPS
        livenessProbe:
          httpGet:
            path: /api/health
            port: grafana
            scheme: HTTPS
          initialDelaySeconds: 60
          timeoutSeconds: 30
          failureThreshold: 10
        # Real leaf cert from the platform's own CA (infrastructure/cert-manager/
        # certificates/grafana.yaml), not self-signed -- Phase 7. The chart has no
        # cert-manager convenience block, unlike Argo CD's "checks for a secret of this
        # exact name" behavior, so this is wired manually.
        #
        # CAUGHT LIVE: a first attempt used the generic extraVolumes/extraVolumeMounts
        # with a plain `secret: {secretName: ...}` volume source -- the pod came up with
        # an *empty* /etc/grafana/tls (grafana-server errored "cannot find SSL cert_file"
        # and crash-looped). `helm template` with the exact same values confirmed why:
        # this chart's extraVolumes only recognizes a fixed set of shorthand keys
        # (existingClaim, hostPath, csi, ...) and silently falls back to `emptyDir: {}`
        # for anything it doesn't recognize -- `secret:` isn't one of them. The chart has
        # a *separate*, purpose-built key for exactly this, extraSecretMounts, which
        # combines the volume and mount in one entry.
        extraSecretMounts:
          - name: grafana-tls
            secretName: grafana-tls
            mountPath: /etc/grafana/tls
            readOnly: true
        # Phase 8 (IAM): OIDC SSO through Keycloak. client_secret comes in via
        # envValueFrom -> GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (Grafana's env-var
        # convention for overriding any grafana.ini value, [section]_key ->
        # GF_SECTION_KEY), sourced from the grafana-oidc-secret bootstrap/install.sh
        # creates -- kept out of the committed grafana.ini block itself, same
        # "credential never lands in git" discipline as the admin password above.
        # auth_url/token_url/api_url point at the same external LAN address
        # (192.168.1.106:9083) used everywhere else in this phase, not Keycloak's
        # in-cluster Service name -- Keycloak's dynamic per-request issuer detection
        # means mixing hostnames between the browser redirect and Grafana's own
        # server-to-server calls would produce inconsistent issuer/audience values.
        # role_attribute_path maps the groups claim (verified actually present in a
        # real token -- see docs/evidence/samples/keycloak-ldap-oidc-verification-
        # 20260729043900.txt) to Grafana's own role model; unmapped groups fall
        # through to Viewer, not Admin -- fail closed, not open.
        envValueFrom:
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
            secretKeyRef:
              name: grafana-oidc-secret
              key: clientSecret
        grafana.ini:
          server:
            protocol: https
            cert_file: /etc/grafana/tls/tls.crt
            cert_key: /etc/grafana/tls/tls.key
            root_url: "https://192.168.1.106:9082/"
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            client_id: grafana
            scopes: "openid profile email groups"
            auth_url: "http://192.168.1.106:9083/auth/realms/platform/protocol/openid-connect/auth"
            token_url: "http://192.168.1.106:9083/auth/realms/platform/protocol/openid-connect/token"
            api_url: "http://192.168.1.106:9083/auth/realms/platform/protocol/openid-connect/userinfo"
            role_attribute_path: "contains(groups[*], 'platform-admins') && 'Admin' || contains(groups[*], 'platform-viewers') && 'Viewer' || 'Viewer'"
            role_attribute_strict: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki-gateway.observability.svc.cluster.local
                isDefault: true
        # Phase 9 (Detection): the platform's first real alerting rule, file-provisioned the
        # same declarative way as the datasource above -- not clicked in through the UI. Watches
        # the kube-apiserver audit log (shipped to Loki since Phase 4, job="kube-audit") for the
        # exact real signal ns-restore's own fault injection produces: a `delete` verb against
        # objectRef.resource=namespaces, objectRef.name=canary. No audit-policy change needed --
        # Metadata-level logging (the policy's default for everything except secrets/RBAC)
        # already includes verb/objectRef/stage, which is all this needs.
        #
        # CAUGHT LIVE: a first attempt used a bare `| json` with no field list, which parses
        # every nested key in the audit event (user.extra.*, annotations.*, sourceIPs, ...) into
        # its own label -- real audit traffic has enough distinct field combinations that this
        # tripped Loki's "maximum number of series (500) reached" limit on a plain 5m window,
        # confirmed by running the query directly against the live Loki instance. Explicit field
        # extraction (`| json verb=`verb`, res=`objectRef.resource`, ...`) only ever produces the
        # handful of label combinations this query actually needs.
        #
        # interval/for are both short and 0s respectively so the rule fires on the very first
        # evaluation that observes the event -- this repo's own `t_detect` is defined as "first
        # alert fired," and a longer debounce would inflate the measured detection latency with
        # nothing real behind it.
        #
        # CAUGHT LIVE (real drill run): a first attempt used queryType: range for node A, which
        # returns a full time-series result (one value per 1s step across the 60s window) --
        # Grafana's threshold expression (node C) can only alert on *reduced* data (a single
        # scalar), and rejected it every evaluation with "invalid format of evaluation results...
        # looks like time series data, only reduced data can be alerted on", stuck at
        # `state: Normal (NoData)` forever. Confirmed via the rule's own
        # /api/prometheus/grafana/api/v1/rules status, not assumed from a clean provisioning
        # apply -- a real drill run's detection-poll genuinely timed out because of this before
        # it was caught. `queryType: instant` makes the Loki query return one reduced value per
        # evaluation, which is what alerting on a `count_over_time(...)` aggregate actually needs.
        #
        # CAUGHT LIVE, AGAIN (same drill re-run after the instant-query fix): a 60s window was too
        # tight against real pipeline latency -- the rule's own state showed the correct labels
        # appearing (job/verb/objname all matched) but still `Normal (NoData)`, with `activeAt`
        # landing ~66s after the real fault-injection timestamp, i.e. just past the edge of a 60s
        # `[1m]` lookback by the time Alloy shipped the audit line, Loki ingested it, and Grafana's
        # own evaluation tick landed. Widened to a 3m window/lookback -- still requires the exact
        # same real audit event, just gives the real shipping+ingestion+evaluation pipeline
        # realistic slack rather than fighting sub-minute propagation timing.
        alerting:
          rules.yaml:
            apiVersion: 1
            groups:
              - orgId: 1
                name: detection
                folder: Detection
                interval: 10s
                rules:
                  - uid: canary-ns-delete-detect
                    title: "Canary namespace deleted"
                    condition: C
                    data:
                      - refId: A
                        datasourceUid: loki
                        relativeTimeRange:
                          from: 180
                          to: 0
                        model:
                          refId: A
                          queryType: instant
                          intervalMs: 1000
                          maxDataPoints: 43200
                          expr: 'count_over_time({job="kube-audit"} | json verb=`verb`, res=`objectRef.resource`, objname=`objectRef.name` | verb=`delete` | res=`namespaces` | objname=`canary` [3m])'
                      - refId: C
                        datasourceUid: "-100"
                        model:
                          refId: C
                          type: threshold
                          expression: A
                          datasource:
                            type: __expr__
                            uid: "-100"
                          conditions:
                            - evaluator:
                                type: gt
                                params: [0]
                              operator:
                                type: and
                              query:
                                params: ["C"]
                              reducer:
                                type: last
                                params: []
                    noDataState: OK
                    execErrState: OK
                    for: 0s
                    labels:
                      severity: detection
                    annotations:
                      summary: "Canary namespace deletion detected via the kube-apiserver audit log (job=kube-audit)"
                  # Phase 13 (endpoint runtime security): watches Tetragon's own stdout-exported
                  # process_exec events (real eBPF-observed execve, no synthetic signal) for a
                  # shell binary spawned inside the canary namespace -- credential-compromise's
                  # own fault injection (build-spec §6.3 scenario 8). Log lines come from
                  # Tetragon's pods (namespace="tetragon", Alloy's own relabeling), NOT the
                  # canary namespace -- the event's *subject* pod is embedded inside the JSON
                  # body (process_exec.process.pod.namespace), filtered explicitly below. Same
                  # `|= "process_exec"` line-filter-before-json-parse discipline as the rule
                  # above, doubly important here since raw process-exec telemetry is far
                  # higher-volume than the audit log.
                  - uid: canary-shell-spawn-detect
                    title: "Shell spawned inside canary namespace"
                    condition: C
                    data:
                      - refId: A
                        datasourceUid: loki
                        relativeTimeRange:
                          from: 180
                          to: 0
                        model:
                          refId: A
                          queryType: instant
                          intervalMs: 1000
                          maxDataPoints: 43200
                          expr: 'count_over_time({namespace="tetragon"} |= "process_exec" | json binary="process_exec.process.binary", pod_ns="process_exec.process.pod.namespace" | pod_ns=`canary` | binary=~`.*/bin/(sh|bash)` [3m])'
                      - refId: C
                        datasourceUid: "-100"
                        model:
                          refId: C
                          type: threshold
                          expression: A
                          datasource:
                            type: __expr__
                            uid: "-100"
                          conditions:
                            - evaluator:
                                type: gt
                                params: [0]
                              operator:
                                type: and
                              query:
                                params: ["C"]
                              reducer:
                                type: last
                                params: []
                    noDataState: OK
                    execErrState: OK
                    for: 0s
                    labels:
                      severity: detection
                    annotations:
                      summary: "A shell (/bin/sh or /bin/bash) was executed inside the canary namespace, observed via Tetragon's real eBPF process-exec instrumentation"
        # Phase 10 (scenario breadth): RTO/RPO trend dashboard, build-spec §6.1's own framing
        # ("charting measured RPO across many runs... is the most persuasive single artifact
        # this project can produce"). No new plumbing needed -- drill records already land in
        # Loki today via drills/lib/emit.py's stdout + Alloy's existing DaemonSet, the same
        # pipeline the alerting rule above already reads from. `| unwrap` turns each drill
        # record's own numeric field into a plotted time-series point -- the same explicit-
        # field-extraction discipline (`| json field=`field``) already used above to avoid
        # Loki's series-cardinality limit, just for metrics instead of a count. Same
        # file-provisioning convention as datasources/alerting -- no UI clicks.
        #
        # CAUGHT LIVE: a first attempt used a bare `{...} | json ... | unwrap rto` as the whole
        # query -- Loki rejected it outright ("syntax error: unexpected unwrap"). Unwrapped
        # values are only valid inside a range-vector aggregation
        # (`max_over_time(<selector> | unwrap <field> [<range>]) by (<label>)`), confirmed live
        # against the real Loki instance (a real multi-scenario matrix result, one series per
        # scenario) before being written down here, not assumed from LogQL docs alone.
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            drill-trends:
              json: |
                {
                  "title": "Drill RTO/RPO trends",
                  "uid": "drill-trends",
                  "editable": true,
                  "timezone": "utc",
                  "time": { "from": "now-7d", "to": "now" },
                  "refresh": "",
                  "schemaVersion": 39,
                  "panels": [
                    {
                      "id": 1,
                      "type": "timeseries",
                      "title": "Measured RTO by scenario",
                      "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
                      "datasource": { "type": "loki", "uid": "loki" },
                      "fieldConfig": {
                        "defaults": { "unit": "s", "custom": { "drawStyle": "points", "pointSize": 6 } },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "loki", "uid": "loki" },
                          "expr": "max_over_time({namespace=\"argo-workflows\"} |= \"drill_id\" | json scenario=\"scenario\", rto=\"measured_rto_seconds\" | unwrap rto [$__interval]) by (scenario)",
                          "queryType": "range"
                        }
                      ]
                    },
                    {
                      "id": 2,
                      "type": "timeseries",
                      "title": "Measured RPO (records lost) by scenario",
                      "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
                      "datasource": { "type": "loki", "uid": "loki" },
                      "fieldConfig": {
                        "defaults": { "unit": "short", "custom": { "drawStyle": "points", "pointSize": 6 } },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "loki", "uid": "loki" },
                          "expr": "max_over_time({namespace=\"argo-workflows\"} |= \"drill_id\" | json scenario=\"scenario\", rpo=\"measured_rpo_records_lost\" | unwrap rpo [$__interval]) by (scenario)",
                          "queryType": "range"
                        }
                      ]
                    },
                    {
                      "id": 3,
                      "type": "table",
                      "title": "Recent drill verdicts",
                      "gridPos": { "h": 10, "w": 24, "x": 0, "y": 9 },
                      "datasource": { "type": "loki", "uid": "loki" },
                      "options": { "showHeader": true, "sortBy": [{ "displayName": "Time", "desc": true }] },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "loki", "uid": "loki" },
                          "expr": "{namespace=\"argo-workflows\"} |= \"drill_id\" | json drill_id=\"drill_id\", scenario=\"scenario\", verdict=\"verdict\", rto=\"measured_rto_seconds\", integrity=\"integrity_check\"",
                          "queryType": "range"
                        }
                      ]
                    }
                  ]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
