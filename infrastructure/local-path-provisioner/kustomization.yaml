# Talos has no bundled CSI driver (unlike k3s's local-path-provisioner-by-default).
# This is the exact setup docs.siderolabs.com/kubernetes-guides/csi/local-storage
# recommends: rancher/local-path-provisioner, host path moved from /opt (read-only on
# Talos) to /var (the persistent, writable partition), local-path-storage namespace
# marked privileged for the provisioner's helper pods.
resources:
  - github.com/rancher/local-path-provisioner/deploy?ref=v0.0.36

patches:
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      - op: replace
        path: /data/config.json
        value: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":["/var/mnt/local-path-provisioner"]
                  }
                  ]
          }
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
