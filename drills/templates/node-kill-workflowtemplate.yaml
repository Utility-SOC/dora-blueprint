# Executes drills/scenarios/node-kill.yaml (build-spec §6.3 scenario 1). Same single-bash-step
# shape as ns-restore-workflowtemplate.yaml, same reasoning (sequential stages sharing shell
# variables). bitnami/kubectl only, matching every other drill template.
#
# Real, load-bearing design note: tainting a node with node.kubernetes.io/unreachable:NoExecute
# alone does NOT immediately evict tolerating pods -- the API server's DefaultTolerationSeconds
# admission plugin gives most pods a default 300s grace period against exactly this taint, the
# same grace period a genuinely unreachable node gets in a real cluster before eviction. Waiting
# out 5 minutes every drill run isn't practical for a repeatable check, so this drill force-deletes
# the pod immediately after tainting -- compressing "eventually the taint manager evicts it" into
# "now", without changing what actually gets tested (whether a fresh pod can schedule and mount
# the canary's PV once the taint is in place). Stated plainly, not silently sped up.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: node-kill
  namespace: argo-workflows
spec:
  serviceAccountName: argo-workflow
  entrypoint: run
  templates:
    - name: run
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      container:
        image: bitnami/kubectl@sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d
        command: ["bash", "-ceu"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        args:
          - |
            DRILL_ID="node-kill-$(date -u +%Y%m%d%H%M%S)"
            GIT_SHA="{{workflow.parameters.git-sha}}"

            echo "[$DRILL_ID] capturing baseline from the live canary"
            CANARY_POD="$(kubectl -n canary get pod -l app=canary-writer -o jsonpath='{.items[0].metadata.name}')"
            NODE_NAME="$(kubectl -n canary get pod "$CANARY_POD" -o jsonpath='{.spec.nodeName}')"
            MAX_BEFORE="$(kubectl -n canary exec "$CANARY_POD" -- python3.13 /scripts/verify.py --field max_counter)"
            echo "[$DRILL_ID] canary-writer is on node $NODE_NAME"

            T_INJECT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "[$DRILL_ID] t_inject=$T_INJECT — tainting $NODE_NAME unreachable:NoExecute (fault injection)"
            kubectl taint node "$NODE_NAME" node.kubernetes.io/unreachable=:NoExecute --overwrite

            echo "[$DRILL_ID] force-deleting the pod to compress the default 300s eviction grace period (see template header)"
            kubectl -n canary delete pod "$CANARY_POD" --grace-period=0 --force --wait=false

            echo "[$DRILL_ID] observing whether a replacement pod can schedule while the taint holds (60s window)"
            RESCHEDULED_WHILE_TAINTED="false"
            for i in $(seq 1 12); do
              NEW_POD="$(kubectl -n canary get pod -l app=canary-writer -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              if [ -n "$NEW_POD" ]; then
                PHASE="$(kubectl -n canary get pod "$NEW_POD" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
                if [ "$PHASE" = "Running" ]; then
                  RESCHEDULED_WHILE_TAINTED="true"
                  break
                fi
              fi
              sleep 5
            done
            if [ "$RESCHEDULED_WHILE_TAINTED" = "true" ]; then
              echo "[$DRILL_ID] a replacement pod reached Running while the node was still tainted -- canary tolerated node loss without needing recovery"
              MANUAL_STEPS=0
            else
              echo "[$DRILL_ID] no replacement pod reached Running while tainted -- consistent with canary's PV (openebs-hostpath) being node-local and non-replicated; a real, not assumed, limitation of local storage"
              MANUAL_STEPS=0
            fi

            echo "[$DRILL_ID] removing the taint (recovery: the node becomes viable again)"
            kubectl taint node "$NODE_NAME" node.kubernetes.io/unreachable:NoExecute- || true

            echo "[$DRILL_ID] waiting for canary-writer to report Ready"
            kubectl -n canary wait --for=condition=Ready pod -l app=canary-writer --timeout=180s
            T_RECOVER="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            RECOVERED_POD="$(kubectl -n canary get pod -l app=canary-writer -o jsonpath='{.items[0].metadata.name}')"
            RECOVERED_NODE="$(kubectl -n canary get pod "$RECOVERED_POD" -o jsonpath='{.spec.nodeName}')"
            INTEGRITY="$(kubectl -n canary exec "$RECOVERED_POD" -- python3.13 /scripts/verify.py --field integrity_check)"
            MAX_AFTER="$(kubectl -n canary exec "$RECOVERED_POD" -- python3.13 /scripts/verify.py --field max_counter)"
            T_VERIFY="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            RTO=$(( $(date -u -d "$T_RECOVER" +%s) - $(date -u -d "$T_INJECT" +%s) ))
            if [ "$INTEGRITY" = "pass" ] && [ "$MAX_AFTER" -ge "$MAX_BEFORE" ]; then VERDICT="pass"; else VERDICT="fail"; fi

            echo "[$DRILL_ID] recovered onto node $RECOVERED_NODE (originally $NODE_NAME) -- $([ "$RECOVERED_NODE" = "$NODE_NAME" ] && echo 'same node, confirming the PV-node-affinity limitation' || echo 'a different node, meaning it genuinely rescheduled elsewhere')"

            echo "[$DRILL_ID] emitting drill record"
            RECORD="$(cat <<EOF
            {"drill_id":"${DRILL_ID}","scenario":"node-kill","git_sha":"${GIT_SHA}","cluster_profile":"core","controls":["DORA-Art11","NIS2-21.2.c","ISO-A.8.13"],"target_rto_seconds":300,"target_rpo_seconds":0,"measured_rto_seconds":${RTO},"integrity_check":"${INTEGRITY}","verdict":"${VERDICT}","manual_runbook_steps_required":${MANUAL_STEPS},"t_inject":"${T_INJECT}","t_recover":"${T_RECOVER}","t_verify":"${T_VERIFY}","artifacts":["tainted node: ${NODE_NAME}","recovered on node: ${RECOVERED_NODE}","rescheduled while tainted: ${RESCHEDULED_WHILE_TAINTED}"]}
            EOF
            )"
            echo "$RECORD" | jq -c .

            echo "RESULT_RTO_SECONDS=${RTO}"
            echo "RESULT_VERDICT=${VERDICT}"
  arguments:
    parameters:
      - name: git-sha
        value: "unknown"
