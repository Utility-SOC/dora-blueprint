# Lightweight core-profile log sink (build-spec §7 "pluggable observability" — Loki
# chosen over the full/Elastic profile here; interface, not vendor, is the point).
# SingleBinary mode + filesystem storage: no S3/MinIO dependency, no extra caching
# tier — Velero+MinIO (Phase 3) is a separate, purpose-built object store, not reused
# here to keep this component's failure domain independent of the backup/restore path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.1.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 5Gi
        # deploymentMode alone doesn't zero these — the chart's validate.yaml checks
        # actual replica counts, and SimpleScalable's defaults are nonzero regardless
        # of deploymentMode. Setting deploymentMode without this fails the same way.
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        minio:
          enabled: false
        test:
          enabled: false
        monitoring:
          selfMonitoring:
            enabled: false
        # lokiCanary is top-level in this chart, not nested under monitoring — an
        # earlier version of this file put it there and it silently had no effect
        # (Helm ignores unknown keys rather than erroring), so it kept deploying.
        lokiCanary:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
