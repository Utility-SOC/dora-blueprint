# Phase 11 (Incident response): GLPI's own network policy. Ingress explicit-allow list from
# the start, not left implicitly-unrestricted the way Grafana's was until Phase 9 forced a
# retrofit -- kubelet host probes (port 80, GLPI's real container port -- confirmed via the
# Service's own targetPort, same convention as every other namespace in this repo).
#
# CORRECTION: the argo-workflows rule below was written assuming open-incident.py's ticket
# calls would run inside the workflow pod, mirroring Phase 9's Grafana-detection-poll pattern.
# Confirmed live that assumption was wrong: open-incident.py (like enrich.py) runs host-side,
# invoked by run-drill.sh on appserv *after* the workflow finishes, and reaches GLPI via the
# same LAN port-forward address a human uses (which bypasses Cilium entirely, confirmed
# repeatedly elsewhere in this repo) -- so this rule currently allows traffic that never
# actually occurs. Left in place anyway: it still closes a real ingress gap (matching Grafana's
# own Phase 9 reasoning) and is the correct rule if ticket-creation is ever moved in-cluster --
# harmless over-permissiveness in the "allow" direction, not a security regression, but flagged
# here rather than silently claimed as exercised.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: glpi
  namespace: glpi
spec:
  endpointSelector:
    matchLabels:
      app: glpi
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argo-workflows
          matchExpressions:
            - key: workflows.argoproj.io/workflow
              operator: Exists
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app: mariadb
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Native LDAP auth (infrastructure/glpi/configure-glpi-ldap.sh) -- in-cluster Service
    # DNS is fine here, unlike the Keycloak-OIDC egress rules elsewhere in this repo: LDAP
    # has no issuer/Host-header matching concern, so there's no reason to route it through
    # the external LAN address the way OIDC traffic has to.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": openldap
            app: openldap
      toPorts:
        - ports:
            - port: "389"
              protocol: TCP
---
# MariaDB: reachable only from GLPI within this namespace -- no egress needed, a pure
# responder, same reasoning already established for OpenLDAP's own egressDeny.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mariadb
  namespace: glpi
spec:
  endpointSelector:
    matchLabels:
      app: mariadb
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: glpi
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
  egressDeny:
    - {}
