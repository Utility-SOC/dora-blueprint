# App-of-apps for the `full`-tier additions only -- applied by bootstrap/install.sh in
# addition to (not instead of) root-app.yaml, only when TIER=full. Points at apps/full/: IAM
# (Keycloak + Postgres + OpenLDAP + LAM, Phase 8), endpoint runtime security (Tetragon, Phase 13),
# and vulnerability management (Trivy Operator + findings exporter, Phase 24) -- none of these
# are required for `make drill SCENARIO=ns-restore` to succeed, unlike everything in
# apps/core/ (see root-app.yaml).
#
# A separate root Application rather than a second `path` on the same one: `source.path` is a
# single static value per Application, so a tier that's sometimes-applied needs its own object,
# not a conditional field within root-app.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-full
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: git@github.com:utility-soc/dora-blueprint.git
    targetRevision: main
    path: apps/full
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
