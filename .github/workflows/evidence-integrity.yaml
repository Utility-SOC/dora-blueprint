# Phase 20 (evidence integrity): closes the gap docs/06-operations.md and
# docs/05-shared-responsibility.md both state plainly -- today's evidence samples are ordinary
# git-tracked files, so git history alone is their tamper-evidence property. docs/evidence/chain.py
# gives them a real hash chain (same mechanism canary/writer.py already uses for its own rows);
# this workflow anchors that chain's head with a real, externally-verifiable signature rather
# than leaving "trust git history" as the only property -- the same GitHub OIDC -> Fulcio ->
# Rekor keyless-signing mechanism Phase 12 already uses for image signing
# (.github/workflows/build-images.yaml), applied to a blob instead of an image.
#
# Regenerate-then-commit, same convention as images/generate-roi.py: a contributor runs
# `python3 docs/evidence/chain.py` locally after adding/changing a sample and commits the
# result. This job checks that happened -- but via `chain.py --verify`, not a raw
# `git diff --exit-code` against a fresh `chain.py` run.
#
# CAUGHT LIVE (first real run of this workflow, run 36521135959): a `git diff --exit-code`
# step here failed every single time, on an unmodified repo -- `generated_at` is a wall-clock
# timestamp, written fresh on every `chain.py` invocation by design, so a full-file diff between
# "freshly regenerated" and "committed a moment earlier" always shows that one field changing,
# even with zero real changes. `chain.py --verify` (still one step below) already does the
# right comparison -- it recomputes file_hash/chain_hash per entry and compares those plus the
# final chain_head, deliberately never touching generated_at -- so this job just relies on that
# instead of a second, cruder check that could never pass.
name: Evidence integrity chain

on:
  push:
    branches: [main]
    paths:
      - "docs/evidence/samples/**"
      - "docs/evidence/chain.py"
      - "docs/evidence/integrity-chain.json"
      - ".github/workflows/evidence-integrity.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for cosign keyless: Fulcio issues a short-lived cert bound to this run's OIDC token

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the committed chain against real current file content
        # Fails if docs/evidence/samples/ was edited, added to, or had a file removed without
        # regenerating docs/evidence/integrity-chain.json (`python3 docs/evidence/chain.py`)
        # locally first -- exactly the check the removed git-diff step was trying for, done
        # right: this compares substance (file_hash/chain_hash per entry, final chain_head),
        # not a raw text diff that a legitimate, always-changing timestamp field would always
        # trip.
        run: python3 docs/evidence/chain.py --verify

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign the chain file (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature docs/evidence/integrity-chain.json.sig \
            --output-certificate docs/evidence/integrity-chain.json.pem \
            docs/evidence/integrity-chain.json

      - name: Verify signature (real verification, not assumed from a 0 exit code above)
        # Exact --certificate-identity, same discipline as build-images.yaml's own final
        # verification step and infrastructure/kyverno/policies/verify-image-signatures.yaml's
        # admission-time check.
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/evidence-integrity.yaml@refs/heads/main"
          cosign verify-blob \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --signature docs/evidence/integrity-chain.json.sig \
            --certificate docs/evidence/integrity-chain.json.pem \
            docs/evidence/integrity-chain.json

      - name: Upload signature + certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-integrity-chain-signature
          path: |
            docs/evidence/integrity-chain.json
            docs/evidence/integrity-chain.json.sig
            docs/evidence/integrity-chain.json.pem
          retention-days: 90

      - name: Summary
        run: |
          CHAIN_HEAD="$(python3 -c 'import json; print(json.load(open("docs/evidence/integrity-chain.json"))["chain_head"])')"
          {
            echo "### Evidence integrity chain signed"
            echo ""
            echo "Chain head: \`${CHAIN_HEAD}\`"
            echo ""
            echo "Signed keylessly (GitHub OIDC -> Fulcio -> Rekor) -- the signature and certificate are"
            echo "attached to this run as the \`evidence-integrity-chain-signature\` artifact. Anyone can"
            echo "independently verify with:"
            echo ""
            echo '```'
            echo "cosign verify-blob --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/evidence-integrity.yaml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com --signature integrity-chain.json.sig --certificate integrity-chain.json.pem integrity-chain.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
