# In-cluster, single-node MinIO — build-spec §7: "no cloud account is needed."
# Root credentials come from a pre-existing Secret (bootstrap/install.sh decrypts
# infrastructure/velero/secrets/minio-root-credentials.enc.yaml and creates it), never
# from plaintext values here.
#
# Correction: MinIO ended community-edition image publishing around Oct 2025 (no new
# tags on Docker Hub/Quay since; console/admin features stripped behind a paywall
# before that). RELEASE.2025-10-15T17-29-55Z — the newest tag GitHub's release list
# shows — was never actually pushed to Docker Hub ("not found" on pull).
# RELEASE.2025-09-07T16-13-09Z, confirmed pullable, is genuinely the last real one.
# Pinned by digest, not just tag, since this registry is now effectively frozen and a
# tag alone won't move under us either way.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      valuesObject:
        image:
          # Chart template renders "repository:tag" literally — no separate digest
          # field — so the digest is pinned by splitting it across both.
          repository: minio/minio@sha256
          tag: 14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        mode: standalone
        existingSecret: minio-root-credentials
        persistence:
          enabled: true
          storageClass: local-path
          size: 5Gi
        buckets:
          - name: velero-backups
            policy: none
            purge: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        consoleService:
          type: ClusterIP
        service:
          type: ClusterIP
        # OIDC SSO via Keycloak (real AssumeRoleWithWebIdentity federation, not a proxy) --
        # infrastructure/keycloak/configure-minio-oidc.sh creates the "minio" client and
        # its groups claim mapper; minio-oidc-secret is applied by bootstrap/install.sh
        # step 8 from the same secret that script prints. claimName is "groups", not a
        # MinIO-specific "policy" claim -- group -> policy binding happens locally via
        # `mc admin policy attach ... --group=`, same "IdP asserts membership, the app
        # maps it" pattern already used for Argo CD's policy.csv and Grafana's roles.
        # configUrl/redirectUri use the external LAN address (192.168.1.106:9083), not
        # in-cluster Service DNS, for the same issuer-matching reason documented in
        # infrastructure/cilium/argocd/argocd-server.yaml -- Keycloak's issuer is derived
        # from the request's Host header, and the browser's authorization-code flow hits
        # the LAN address, so MinIO's own server-to-server calls must match it exactly.
        oidc:
          enabled: true
          configUrl: "http://192.168.1.106:9083/auth/realms/platform/.well-known/openid-configuration"
          clientId: minio
          existingClientSecretName: minio-oidc-secret
          existingClientSecretKey: clientSecret
          claimName: groups
          scopes: "openid,profile,email"
          redirectUri: "http://192.168.1.106:9084/oauth_callback"
          displayName: "Keycloak"
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
