# Confirmed via Hubble: ingress is `host` (a tcpSocket liveness probe on 9001,
# periodSeconds: 10 -- matches the deployment's probe spec exactly, unlike the other
# argocd components' httpGet probes). No notification triggers are configured in this
# lab, so egress is just the baseline kube-apiserver + DNS watch traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notifications-controller
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-notifications-controller
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9001"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
