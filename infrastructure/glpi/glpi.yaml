# Phase 11 (Incident response): self-hosted GLPI, the incident-ticket destination for the
# ns-restore drill's classification+clocks output (drills/lib/open-incident.py), replacing an
# earlier GitHub-Issues-based design -- self-hosted to match every other credential/service in
# this repo (Keycloak, OpenLDAP, Grafana, MinIO all self-hosted; nothing here calls out to a
# SaaS product for a core function).
#
# Official `glpi/glpi` image (Docker Hub/GHCR, maintained by the GLPI project itself, weekly
# security rebuilds -- same trust tier as grafana/grafana or docker.io/keycloak). No official
# Helm chart exists (only unverified community ones), same shape of problem as OpenLDAP -- bare
# Deployment/Service/PVC, not a third-party chart of uncertain maintenance quality.
#
# GLPI_SKIP_AUTOINSTALL is deliberately left at its default (false): setting the four
# GLPI_DB_* env vars triggers a real automatic database install on first boot, no manual setup
# wizard click-through needed -- matches this repo's GitOps-everything discipline.
#
# CAUGHT LIVE: a first attempt used a full restricted-compliant securityContext
# (runAsNonRoot/runAsUser 1000/allowPrivilegeEscalation false/capabilities drop ALL), which
# crash-looped immediately with "/opt/startup.sh: Permission denied". Confirmed directly, not
# assumed: `docker run --entrypoint sh glpi/glpi:10.0.18 -c 'ls -la /opt/startup.sh'` shows
# `-rwxr--r-- root root` -- execute permission genuinely isn't set for non-owner, so no
# securityContext short of running as root can exec it. Exempted via a namespace+name-scoped
# Kyverno exclude (infrastructure/kyverno/policies/require-pod-security-restricted.yaml), same
# mechanism as the openldap/alloy/velero exceptions -- see docs/exceptions/glpi.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-data
  namespace: glpi
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi
  namespace: glpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi
  template:
    metadata:
      labels:
        app: glpi
    spec:
      containers:
        - name: glpi
          image: glpi/glpi:10.0.18
          env:
            # CAUGHT LIVE: the image bakes in GLPI_SKIP_AUTOINSTALL=false as a literal string
            # default (confirmed via `kubectl exec ... env`), but /opt/install.sh's own check is
            # `[[ -z "$GLPI_SKIP_AUTOINSTALL" ]]` -- an empty-string test, not a truthiness check.
            # The non-empty string "false" makes that test false, so auto-install was silently
            # SKIPPED every boot despite no database ever being installed -- confirmed by a real
            # pod that stayed 1/1 Running (Apache came up fine) while GLPI itself served "Database
            # configuration file ... is missing" on every request. A Kubernetes env var can't
            # delete an image-baked ENV, only override it -- explicit empty string here is what
            # actually satisfies the upstream script's own (arguably buggy) check.
            - name: GLPI_SKIP_AUTOINSTALL
              value: ""
            - name: GLPI_DB_HOST
              value: mariadb.glpi.svc.cluster.local
            - name: GLPI_DB_PORT
              value: "3306"
            - name: GLPI_DB_NAME
              value: glpi
            - name: GLPI_DB_USER
              value: glpi
            - name: GLPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glpi-db
                  key: glpiDbPassword
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/glpi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: glpi-data
---
apiVersion: v1
kind: Service
metadata:
  name: glpi
  namespace: glpi
spec:
  selector:
    app: glpi
  ports:
    - name: http
      port: 80
      targetPort: 80
