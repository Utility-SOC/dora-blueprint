# ScenarioSpec — build-spec §6.3 scenario 8. Metadata only; drills/templates/ has the
# executable WorkflowTemplate. See drills/scenarios/ns-restore.yaml for why this file
# is kept separate from the workflow's own step logic.
name: credential-compromise
description: >
  Execs into canary-writer and reads its own mounted ServiceAccount token -- the honest
  stand-in for "an attacker who gained exec access is harvesting a real credential" --
  then spawns /bin/sh, a real, anomalous process for a container that normally only ever
  runs python3 writer.py. Detection is real: Tetragon's eBPF instrumentation genuinely
  observes the execve, a Grafana Alerting rule watches for it in Loki, and t_detect is
  captured from that rule's own live state, never self-reported. Validates the
  runtime-detection path end to end (build-spec §6.3) -- nothing is actually broken by
  this drill (canary-writer stays healthy throughout), so this is a detection-validation
  scenario shaped like network-partition, not a break/recover one.
target_rto_seconds: 60
target_rpo_seconds: 0
controls:
  - DORA-Art9
  - DORA-Art10
  - ISO-A.8.16
workflow_template: credential-compromise
