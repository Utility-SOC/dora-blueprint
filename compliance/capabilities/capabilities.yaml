# Capability layer: the hub every framework mapping points at.
#
# A capability is something this lab actually does (or plans to do) that can be demonstrated and
# evidenced. Frameworks are mapped to capabilities independently (compliance/mappings/<framework>.yaml),
# never framework-to-framework, so mapping errors do not compound through transitive hops.
#
# Fields: see schema.json. Validate with `make capabilities-check`.
# status: implemented (mechanism + generated evidence) | partial | planned
# Seeded 2026-10-06 from the repo as it stands on main; roadmap task X01 completes and reviews it.
version: 1
capabilities:

# --- Platform and change control -----------------------------------------------------------------
- id: CAP-PLAT-01
  name: Immutable, API-managed node OS
  description: Nodes run Talos Linux, with no shell or SSH and configuration applied as declarative machine config.
  status: implemented
  implemented_by: [platform/talos/patches/common.yaml, platform/talos/patches/control-plane.yaml, platform/talos/README.md]
  demo: talosctl -n <node> get machineconfig   # no SSH path exists to try instead
- id: CAP-PLAT-02
  name: GitOps reconciliation of all workloads
  description: Argo CD continuously reconciles every workload from Git; bootstrap/install.sh is the only imperative step.
  status: implemented
  implemented_by: [bootstrap/install.sh, bootstrap/root-app.yaml, apps/]
  demo: kubectl -n argocd get applications
- id: CAP-PLAT-03
  name: Scoped GitOps permissions
  description: Argo CD runs under a restricted AppProject (source repos, destinations, kinds), never project default.
  status: implemented
  implemented_by: [bootstrap/appproject-platform.yaml]
- id: CAP-PLAT-04
  name: Everything pinned
  description: Chart versions, image digests and tool versions are pinned; floating tags are banned.
  status: partial
  implemented_by: [apps/, bootstrap/install.sh, infrastructure/kyverno/policies/verify-image-signatures.yaml]
  roadmap: [T07]
- id: CAP-PLAT-05
  name: Reviewed change via pull requests
  description: Changes reach the platform only through reviewed, tested pull requests to main.
  status: planned
  roadmap: [D8, T07]
- id: CAP-PLAT-06
  name: Time synchronisation to named sources
  description: Nodes sync time to pinned NTP sources, which every measured timestamp depends on.
  status: partial
  implemented_by: [platform/talos/patches/common.yaml]
  roadmap: [F08]

# --- Admission and workload hardening ------------------------------------------------------------
- id: CAP-ADM-01
  name: Pod Security Standards restricted, enforced
  description: Kyverno enforces the PSS restricted profile cluster-wide; privileged pods are denied at admission.
  status: implemented
  implemented_by: [infrastructure/kyverno/policies/require-pod-security-restricted.yaml]
  evidence: [docs/evidence/samples/kyverno-admission-20260728202845.txt]
  demo: kubectl -n canary run demo-priv --image=busybox:1.36 --privileged --restart=Never -- true
- id: CAP-ADM-02
  name: Scoped, reasoned policy exceptions
  description: Every privileged workload has a committed PolicyException plus a written risk acceptance.
  status: implemented
  implemented_by: [infrastructure/kyverno/exceptions/, docs/exceptions/]
- id: CAP-ADM-03
  name: Signed-image admission
  description: Kyverno verifyImages requires a keyless signature and SBOM attestation from the exact CI workflow identity.
  status: implemented
  implemented_by: [infrastructure/kyverno/policies/verify-image-signatures.yaml]

